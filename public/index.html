<!doctype html>
<html>
<head><meta charset="utf-8"><title>Replit Clone</title></head>
<body>
<h2>Mini Replit</h2>

<div>
  <input id="projName" placeholder="project name" />
  <button id="newProj">New</button>

  <select id="projSel"></select>
  <button id="load">Load</button>
  <button id="run">Run</button>
  <button id="tasks">Tasks</button>
</div>

<div style="margin-top:10px;">
  <input id="filePath" placeholder="main.py" />
  <button id="openFile">Open</button>
  <button id="saveFile">Save</button>
</div>

<textarea id="editor" style="width:100%;height:300px;"></textarea>
<pre id="out"></pre>

<script>
let current = null;

async function refresh() {
  const r = await fetch("/api/projects");
  const p = await r.json();
  const sel = document.getElementById("projSel");
  sel.innerHTML = "";
  p.forEach(x => {
    const o = document.createElement("option");
    o.value = x.id;
    o.textContent = x.name;
    sel.appendChild(o);
  });
}

document.getElementById("newProj").onclick = async () => {
  const name = document.getElementById("projName").value || "proj";
  await fetch("/api/projects", {
    method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify({ name })
  });
  refresh();
};

document.getElementById("load").onclick = () => {
  current = document.getElementById("projSel").value;
  document.getElementById("out").textContent = "Loaded: " + current;
};

document.getElementById("openFile").onclick = async () => {
  if (!current) return alert("Load project first");
  const path = document.getElementById("filePath").value;
  const r = await fetch(`/api/projects/${current}/files/${path}`);
  if (!r.ok) return alert("Not found");
  const file = await r.json();
  document.getElementById("editor").value = file.content;
};

document.getElementById("saveFile").onclick = async () => {
  if (!current) return alert("Load project first");
  const path = document.getElementById("filePath").value;
  const content = document.getElementById("editor").value;
  await fetch(`/api/projects/${current}/files`, {
    method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify({ path, content })
  });
  alert("Saved");
};

document.getElementById("run").onclick = async () => {
  await fetch(`/api/projects/${current}/run`, { method: "POST" });
  document.getElementById("out").textContent = "Running...";
};

document.getElementById("tasks").onclick = async () => {
  const r = await fetch("/api/tasks");
  document.getElementById("out").textContent = JSON.stringify(await r.json(), null, 2);
};

refresh();
</script>
</body>
</html>
